<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">eShop</a>
    <nav><a href="index.html">Home</a><a href="product.html">Products</a><a href="checkout.html">Cart</a></nav>
  </header>
  <main class="container">
    <h1>Checkout</h1>
    <div class="checkout-layout">
      <form class="panel" action="#" method="post">
        <h2>Customer Information</h2>
        <label for="name">Name</label><input id="name" name="name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" required>
        <label for="address">Address</label><input id="address" name="address" required>
        <h2>Payment Method</h2>
        <label class="radio"><input type="radio" name="payment" value="card" checked> Credit or debit card</label>
        <label class="radio"><input type="radio" name="payment" value="cash"> Cash on delivery</label>
        <button class="button" type="submit">Place Order</button>
      </form>
      <aside class="panel">
        <h2>Your Cart</h2>
        <div class="cart-item">
          <strong>Wooden Chair</strong>
          <span>Quantity: 1</span>
          <span>$80</span>
        </div>
        <div class="cart-item">
          <strong>Table Lamp</strong>
          <span>Quantity: 2</span>
          <span>$70</span>
        </div>
        <div class="cart-item">
          <strong>Ceramic Mug</strong>
          <span>Quantity: 1</span>
          <span>$15</span>
        </div>
        <hr>
        <p><strong>Total <span class="right">$165</span></strong></p>
      </aside>
    </div>
  </main>
</body>
</html>
