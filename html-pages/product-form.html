<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add or Edit Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">eShop</a>
    <nav><a href="index.html">Store</a><a href="product.html">Products</a></nav>
  </header>
  <main class="container">
    <h1>Add or Edit Product</h1>
    <form class="panel product-form" action="#" method="post">
      <label for="name">Product Name</label><input id="name" name="name" required>
      <label for="description">Description</label><textarea id="description" name="description" rows="4"></textarea>
      <label for="price">Price</label><input id="price" name="price" type="number" min="0" step="0.01" required>
      <label for="stock">Stock</label><input id="stock" name="stock" type="number" min="0" required>
      <label for="image">Product Image</label><input id="image" name="image" type="file" accept="image/*">
      <button class="button" type="submit">Save Product</button>
      <a href="product.html">Cancel</a>
    </form>
  </main>
</body>
</html>
