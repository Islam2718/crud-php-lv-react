/auth/register:
  post:
    summary: "Register a new user"
    tags:
      - Authentication
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
              password_confirmation:
                type: string
                format: password
    responses:
      "201":
        description: "User registered successfully"
      "400":
        description: "Bad request"

/auth/login:
  post:
    summary: "User login"
    tags:
      - Authentication
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      "200":
        description: "User logged in successfully"
      "401":
        description: "Unauthorized"
